<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ministry Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css">
<style>
  :root{
    --bg:#f7f6f3; --panel:#ffffff; --border:#e3e0da; --text:#2b2823; --text-dim:#6b675f;
    --accent:#8a5a2e; --danger:#b3492f; --shadow:0 2px 10px rgba(30,25,15,.08);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1c1a17; --panel:#26231f; --border:#3a352e; --text:#ece8e1; --text-dim:#a39d92;
      --accent:#d99a5b; --danger:#e2795f; --shadow:0 2px 14px rgba(0,0,0,.4);
    }
  }
  *{box-sizing:border-box;}
  html,body{height:100%; margin:0;}
  body{background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  #app{display:flex; flex-direction:column; height:100vh; width:100%;}
  header{
    display:flex; align-items:center; gap:12px; padding:12px 16px; background:var(--panel);
    border-bottom:1px solid var(--border); flex-wrap:wrap; z-index:10;
  }
  h1{font-size:16px; font-weight:700; margin:0; white-space:nowrap;}
  .stat{font-size:12px; color:var(--text-dim); white-space:nowrap;}
  .controls{display:flex; gap:8px; align-items:center; flex:1; flex-wrap:wrap; justify-content:flex-end;}
  input[type=text], select{
    background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:8px;
    padding:7px 10px; font-size:13px; outline:none;
  }
  input[type=text]{min-width:180px;}
  button{
    background:var(--accent); color:#fff; border:none; border-radius:8px; padding:7px 12px;
    font-size:13px; font-weight:600; cursor:pointer;
  }
  button.secondary{background:transparent; color:var(--accent); border:1px solid var(--accent);}
  #mapwrap{position:relative; flex:1;}
  #map{position:absolute; inset:0;}
  #banner{
    position:absolute; top:14px; left:50%; transform:translateX(-50%); z-index:1000; background:var(--panel); color:var(--text);
    border:1px solid var(--border); border-radius:10px; padding:8px 14px; font-size:12px; box-shadow:var(--shadow);
    max-width:min(560px,90vw); text-align:center;
  }
  #banner[hidden]{display:none!important;}
  #banner.warn{color:var(--danger); border-color:var(--danger);}
  .leaflet-popup-content-wrapper{background:var(--panel); color:var(--text); box-shadow:var(--shadow);}
  .leaflet-popup-tip{background:var(--panel);}
  .popup h3{margin:0 0 4px; font-size:14px;}
  .popup .type{display:inline-block; font-size:11px; color:var(--text-dim); margin-bottom:6px;}
  .popup .addr{font-size:12px; color:var(--text-dim); margin:4px 0;}
  .popup a{color:var(--accent); font-size:12px; text-decoration:none;}
  .popup a:hover{text-decoration:underline;}
</style>
</head>
<body>

<div id="app">
  <header>
    <h1>Ministry Map</h1>
    <span class="stat" id="countStat">—</span>
    <div class="controls">
      <input type="text" id="search" placeholder="Search name or address…">
      <select id="stateFilter" hidden><option value="">All states</option></select>
      <select id="typeFilter" hidden><option value="">All types</option></select>
      <button class="secondary" id="refreshBtn">Refresh data</button>
    </div>
  </header>
  <div id="mapwrap">
    <div id="map"></div>
    <div id="banner" hidden></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
<script>
(function(){
  "use strict";

  var els = {
    countStat: document.getElementById('countStat'),
    search: document.getElementById('search'),
    stateFilter: document.getElementById('stateFilter'),
    typeFilter: document.getElementById('typeFilter'),
    refreshBtn: document.getElementById('refreshBtn'),
    banner: document.getElementById('banner'),
  };

  function showBanner(msg, warn){
    if(!msg){ els.banner.hidden = true; return; }
    els.banner.hidden = false;
    els.banner.className = warn ? 'warn' : '';
    els.banner.textContent = msg;
  }

  function parseCSV(text){
    var rows = [], row = [], field = '', i = 0, inQuotes = false;
    while(i < text.length){
      var c = text[i];
      if(inQuotes){
        if(c === '"'){
          if(text[i+1] === '"'){ field += '"'; i += 2; continue; }
          inQuotes = false; i++; continue;
        }
        field += c; i++; continue;
      } else {
        if(c === '"'){ inQuotes = true; i++; continue; }
        if(c === ','){ row.push(field); field=''; i++; continue; }
        if(c === '\r'){ i++; continue; }
        if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; i++; continue; }
        field += c; i++; continue;
      }
    }
    if(field.length || row.length){ row.push(field); rows.push(row); }
    if(!rows.length) return [];
    var headers = rows[0].map(function(h){ return h.trim(); });
    return rows.slice(1).filter(function(r){ return r.some(function(v){ return v && v.trim(); }); }).map(function(r){
      var obj = {};
      headers.forEach(function(h, idx){ obj[h] = (r[idx] || '').trim(); });
      return obj;
    });
  }

  function findKey(obj, candidates){
    var keys = Object.keys(obj);
    for(var c = 0; c < candidates.length; c++){
      for(var k = 0; k < keys.length; k++){
        if(keys[k].toLowerCase().indexOf(candidates[c]) !== -1) return keys[k];
      }
    }
    return null;
  }

  // Merges alternate/extra Ministry Type text into one of the three
  // canonical labels below, so they share a single legend entry, filter
  // option, and color -- not just a matching color. Keys are matched
  // case/whitespace-insensitively. Add more merges here as needed.
  var TYPE_ALIASES = {
    'ministry & full time missionary': 'Missionary',
  };
  function applyTypeAlias(t){
    var key = (t || '').trim().toLowerCase();
    return TYPE_ALIASES[key] || t;
  }

  function normalizeRows(raw){
    if(!raw.length) return [];
    var sample = raw[0];
    var kName = findKey(sample, ['ministry name','name']);
    var kType = findKey(sample, ['ministry type','type']);
    var kWeb  = findKey(sample, ['website','url']);
    var kAddr = findKey(sample, ['address']);
    var kCity = findKey(sample, ['city']);
    var kState= findKey(sample, ['state','province','region']);
    var kZip  = findKey(sample, ['zip','postal']);
    var kCountry = findKey(sample, ['country']);
    var kLat  = findKey(sample, ['latitude','lat']);
    var kLng  = findKey(sample, ['longitude','lng','long']);
    return raw.map(function(r){
      var addrParts = [kAddr, kCity, kState, kZip, kCountry].map(function(k){ return k ? r[k] : ''; }).filter(Boolean);
      return {
        name: kName ? r[kName] : '',
        type: kType ? applyTypeAlias(r[kType]) : '',
        state: kState ? r[kState] : '',
        website: kWeb ? r[kWeb] : '',
        address: addrParts.join(', '),
        lat: kLat && r[kLat] ? parseFloat(r[kLat]) : NaN,
        lng: kLng && r[kLng] ? parseFloat(r[kLng]) : NaN,
      };
    }).filter(function(r){ return r.name; });
  }

  function popupHTML(row){
    var safe = function(s){ return (s||'').replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
    var html = '<div class="popup"><h3>' + safe(row.name) + '</h3>';
    if(row.type) html += '<div class="type">' + safe(row.type) + '</div>';
    if(row.address) html += '<div class="addr">' + safe(row.address) + '</div>';
    if(row.website){
      var href = /^https?:\/\//i.test(row.website) ? row.website : 'https://' + row.website;
      html += '<a href="' + safe(href) + '" target="_blank" rel="noopener">Visit website →</a>';
    }
    html += '</div>';
    return html;
  }

  var mapObj = null, cluster = null, markersByRow = [], missingCoords = 0;

  // Colors for known Ministry Type values. Matching ignores case and
  // leading/trailing spaces, so "Church", " church ", "CHURCH" all match.
  // Add more here as needed -- keys are lowercase.
  var TYPE_COLOR_OVERRIDES = {
    'church': '#0087cd',
    'ministry': '#005298',
    'missionary': '#D4A017',
  };
  var TYPE_PALETTE = ['#4a7c59', '#8a5a9e', '#3a9aa0']; // fallback for any other type
  var typeColors = {}; // filled in by assignTypeColors(), keyed by the ORIGINAL (unnormalized) type text
  var UNMATCHED_COLOR = '#6b6b6b'; // neutral gray -- makes a real mismatch obvious instead of hiding as red

  function normType(t){ return (t || '').trim().toLowerCase(); }

  function assignTypeColors(rows){
    typeColors = {};
    var types = Array.from(new Set(rows.map(function(r){ return r.type; }).filter(Boolean))).sort();
    var nextFallback = 0;
    types.forEach(function(t){
      var key = normType(t);
      if (TYPE_COLOR_OVERRIDES[key]) {
        typeColors[t] = TYPE_COLOR_OVERRIDES[key];
      } else {
        typeColors[t] = TYPE_PALETTE[nextFallback % TYPE_PALETTE.length];
        nextFallback++;
      }
    });
  }

  function colorForType(type){ return typeColors[type] || UNMATCHED_COLOR; }

  var iconCache = {};
  function pinIcon(color){
    if(iconCache[color]) return iconCache[color];
    var icon = L.divIcon({
      className: '',
      html: '<div style="width:32px;height:32px;border-radius:50% 50% 50% 0;background:'+color+';border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.5);transform:rotate(-45deg);"></div>',
      iconSize: [32,32], iconAnchor: [16,32], popupAnchor: [0,-32],
    });
    iconCache[color] = icon;
    return icon;
  }

  function renderLegend(){
    var old = document.getElementById('legend');
    if(old) old.remove();
    var types = Object.keys(typeColors);
    if(!types.length) return;
    var box = document.createElement('div');
    box.id = 'legend';
    box.style.cssText = 'position:absolute; bottom:28px; left:28px; z-index:1000; background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:16px 20px; font-size:14px; box-shadow:var(--shadow); color:var(--text);';
    box.innerHTML = types.map(function(t){
      var safe = t.replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; });
      return '<div style="display:flex;align-items:center;gap:10px;margin:6px 0;"><span style="width:14px;height:14px;border-radius:50%;background:'+typeColors[t]+';display:inline-block;flex:none;"></span>'+safe+'</div>';
    }).join('');
    document.getElementById('mapwrap').appendChild(box);
  }

  function populateSelect(selectEl, rows, field, label){
    var values = Array.from(new Set(rows.map(function(r){ return r[field]; }).filter(Boolean))).sort();
    if(!values.length){ selectEl.hidden = true; return; }
    selectEl.hidden = false;
    selectEl.innerHTML = '<option value="">' + label + '</option>' + values.map(function(v){
      return '<option value="'+v.replace(/"/g,'&quot;')+'">'+v+'</option>';
    }).join('');
  }

  function populateTypeFilter(rows){ populateSelect(els.typeFilter, rows, 'type', 'All types'); }
  function populateStateFilter(rows){ populateSelect(els.stateFilter, rows, 'state', 'All states'); }

  function applyFilter(){
    var q = els.search.value.trim().toLowerCase();
    var type = els.typeFilter.value;
    var state = els.stateFilter.value;
    cluster.clearLayers();
    var shown = 0;
    markersByRow.forEach(function(entry){
      var r = entry.row;
      if(type && r.type !== type) return;
      if(state && r.state !== state) return;
      if(q && (r.name+' '+r.address).toLowerCase().indexOf(q) === -1) return;
      cluster.addLayer(entry.marker);
      shown++;
    });
    els.countStat.textContent = shown + ' of ' + markersByRow.length + ' plotted' +
      (missingCoords ? '  ·  ' + missingCoords + ' need coordinates' : '');
  }

  function addMarker(row){
    var marker = L.marker([row.lat, row.lng], { icon: pinIcon(colorForType(row.type)) });
    marker.bindPopup(popupHTML(row));
    markersByRow.push({ row: row, marker: marker });
  }

  function fitBounds(){
    if(!markersByRow.length) return;
    var group = L.featureGroup(markersByRow.map(function(e){ return e.marker; }));
    try { mapObj.fitBounds(group.getBounds().pad(0.15)); } catch(e){}
  }

  function plotRows(rows){
    markersByRow = [];
    missingCoords = 0;
    if(cluster) mapObj.removeLayer(cluster);
    // Clusters at wide zoom (country/world view), splits into individual
    // pins once you zoom in past state/regional level. Raise
    // disableClusteringAtZoom to keep clustering longer while zooming in,
    // lower it to split apart sooner (i.e. stay unclustered further out).
    cluster = L.markerClusterGroup({
      disableClusteringAtZoom: 6,
      maxClusterRadius: 60,
    });
    assignTypeColors(rows);
    rows.forEach(function(row){
      if(isFinite(row.lat) && isFinite(row.lng) && (row.lat || row.lng)){
        addMarker(row);
      } else {
        missingCoords++;
      }
    });
    mapObj.addLayer(cluster);
    populateTypeFilter(rows);
    populateStateFilter(rows);
    renderLegend();
    applyFilter();
    fitBounds();
    showBanner(missingCoords ? (missingCoords + ' ministr' + (missingCoords===1?'y has':'ies have') + ' no coordinates yet.') : '', !!missingCoords);
  }

  function initMap(){
    if(mapObj) return;
    mapObj = L.map('map', { zoomControl: true, minZoom: 2 }).setView([20, 10], 2);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      maxZoom: 19,
    }).addTo(mapObj);
  }

  // Fixed at the source -- this is the only sheet this page will ever load.
  // No settings screen, no local-storage override: a public visitor has no
  // way to point this page at a different spreadsheet.
  var DEFAULT_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTId5Aukh1XVqy1f8J3XCbcsDMJ7GVx_noJpSriLvgUB3Z_9t7942cS2aJMkr3KSezPYM7RpxumRDHe/pub?gid=0&single=true&output=csv";

  async function boot(){
    initMap();
    showBanner('Loading sheet…');
    try {
      var res = await fetch(DEFAULT_CSV_URL);
      if(!res.ok) throw new Error('HTTP ' + res.status);
      var text = await res.text();
      var rows = normalizeRows(parseCSV(text));
      if(!rows.length){ showBanner('The sheet loaded but had no usable rows.', true); return; }
      showBanner('');
      plotRows(rows);
    } catch(err){
      showBanner('Could not load ministry data right now. Try refreshing in a moment.', true);
    }
  }

  els.refreshBtn.addEventListener('click', function(){
    boot();
  });
  els.search.addEventListener('input', function(){ if(cluster) applyFilter(); });
  els.typeFilter.addEventListener('change', function(){ if(cluster) applyFilter(); });
  els.stateFilter.addEventListener('change', function(){ if(cluster) applyFilter(); });

  initMap();
  boot();
})();
</script>
</body>
</html>
